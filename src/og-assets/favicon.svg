<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd6c0"/>
      <stop offset="60%" stop-color="#ff8364"/>
      <stop offset="100%" stop-color="#ff6b9d"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff5ea"/>
    </linearGradient>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="0" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 圓角背景 -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- 裝飾圓圈 -->
  <circle cx="430" cy="80" r="50" fill="#fff" fill-opacity="0.2"/>
  <circle cx="80" cy="430" r="40" fill="#fff" fill-opacity="0.18"/>

  <!-- 主文字 MBTI (大號) -->
  <text x="256" y="240" font-size="160" font-weight="900" fill="url(#textGrad)" text-anchor="middle"
        font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif"
        letter-spacing="-6" filter="url(#textShadow)">
    MBTI
  </text>

  <!-- 副文字 校園 (繁中) -->
  <text x="256" y="360" font-size="84" font-weight="900" fill="#ffffff" text-anchor="middle"
        font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif"
        letter-spacing="-2" filter="url(#textShadow)">
    校園
  </text>

  <!-- 底部小裝飾線 -->
  <rect x="186" y="396" width="140" height="6" rx="3" fill="#ffffff" fill-opacity="0.85"/>
</svg>
