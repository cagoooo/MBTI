<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- 背景漸層 (跟 logo 一致的粉橘) -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9f3"/>
      <stop offset="35%" stop-color="#ffd6c0"/>
      <stop offset="70%" stop-color="#ff8364"/>
      <stop offset="100%" stop-color="#ff6b9d"/>
    </linearGradient>
    <!-- 標題文字漸層 -->
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff5ea"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="0" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- 漸層背景 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 裝飾圓圈 (右上 / 左下) -->
  <circle cx="1080" cy="80" r="100" fill="#fff" fill-opacity="0.18"/>
  <circle cx="1140" cy="180" r="60" fill="#fff" fill-opacity="0.12"/>
  <circle cx="80" cy="540" r="80" fill="#fff" fill-opacity="0.16"/>
  <circle cx="180" cy="600" r="50" fill="#fff" fill-opacity="0.1"/>

  <!-- 上方小標籤 -->
  <rect x="60" y="60" width="280" height="50" rx="25" fill="#fff" fill-opacity="0.92"/>
  <text x="200" y="93" font-size="22" font-weight="700" fill="#ff8364" text-anchor="middle"
        font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" letter-spacing="2">
    ✨ 一場校園 RPG ✨
  </text>

  <!-- 主標題 MBTI -->
  <text x="60" y="270" font-size="160" font-weight="900" fill="url(#title)" filter="url(#shadow)"
        font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" letter-spacing="-4">
    MBTI
  </text>
  <!-- 主標題 校園奇遇記 -->
  <text x="60" y="420" font-size="120" font-weight="900" fill="white" filter="url(#shadow)"
        font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" letter-spacing="-2">
    校園奇遇記
  </text>

  <!-- 副標 -->
  <text x="60" y="490" font-size="34" font-weight="700" fill="white" fill-opacity="0.95"
        font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">
    玩 10 分鐘故事，找出你的 16 型人格
  </text>

  <!-- 底部資訊條 -->
  <text x="60" y="555" font-size="22" font-weight="500" fill="white" fill-opacity="0.85"
        font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">
    30+ 校園場景　·　4 條支線　·　16 種結局
  </text>
  <text x="60" y="595" font-size="20" font-weight="400" fill="white" fill-opacity="0.75"
        font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">
    by 阿凱老師　·　桃園市龍潭區石門國小
  </text>

  <!-- 右側人格類型方塊裝飾 (4×4 = 16 型示意) -->
  <g transform="translate(820, 200)">
    <!-- Row 1 -->
    <rect x="0"   y="0"   width="60" height="60" rx="14" fill="#fff" fill-opacity="0.92"/>
    <text x="30"  y="40"  font-size="20" font-weight="900" fill="#ff8364" text-anchor="middle"
          font-family="'Noto Sans TC', sans-serif">INTJ</text>
    <rect x="75"  y="0"   width="60" height="60" rx="14" fill="#fff" fill-opacity="0.92"/>
    <text x="105" y="40"  font-size="20" font-weight="900" fill="#ff8364" text-anchor="middle"
          font-family="'Noto Sans TC', sans-serif">INTP</text>
    <rect x="150" y="0"   width="60" height="60" rx="14" fill="#fff" fill-opacity="0.92"/>
    <text x="180" y="40"  font-size="20" font-weight="900" fill="#ff8364" text-anchor="middle"
          font-family="'Noto Sans TC', sans-serif">ENTJ</text>
    <rect x="225" y="0"   width="60" height="60" rx="14" fill="#fff" fill-opacity="0.92"/>
    <text x="255" y="40"  font-size="20" font-weight="900" fill="#ff8364" text-anchor="middle"
          font-family="'Noto Sans TC', sans-serif">ENTP</text>
    <!-- Row 2 -->
    <rect x="0"   y="75"  width="60" height="60" rx="14" fill="#fff" fill-opacity="0.92"/>
    <text x="30"  y="115" font-size="20" font-weight="900" fill="#ff6b9d" text-anchor="middle"
          font-family="'Noto Sans TC', sans-serif">INFJ</text>
    <rect x="75"  y="75"  width="60" height="60" rx="14" fill="#fff" fill-opacity="0.92"/>
    <text x="105" y="115" font-size="20" font-weight="900" fill="#ff6b9d" text-anchor="middle"
          font-family="'Noto Sans TC', sans-serif">INFP</text>
    <rect x="150" y="75"  width="60" height="60" rx="14" fill="#fff" fill-opacity="0.92"/>
    <text x="180" y="115" font-size="20" font-weight="900" fill="#ff6b9d" text-anchor="middle"
          font-family="'Noto Sans TC', sans-serif">ENFJ</text>
    <rect x="225" y="75"  width="60" height="60" rx="14" fill="#fff" fill-opacity="0.92"/>
    <text x="255" y="115" font-size="20" font-weight="900" fill="#ff6b9d" text-anchor="middle"
          font-family="'Noto Sans TC', sans-serif">ENFP</text>
    <!-- Row 3 -->
    <rect x="0"   y="150" width="60" height="60" rx="14" fill="#fff" fill-opacity="0.92"/>
    <text x="30"  y="190" font-size="20" font-weight="900" fill="#22a06b" text-anchor="middle"
          font-family="'Noto Sans TC', sans-serif">ISTJ</text>
    <rect x="75"  y="150" width="60" height="60" rx="14" fill="#fff" fill-opacity="0.92"/>
    <text x="105" y="190" font-size="20" font-weight="900" fill="#22a06b" text-anchor="middle"
          font-family="'Noto Sans TC', sans-serif">ISFJ</text>
    <rect x="150" y="150" width="60" height="60" rx="14" fill="#fff" fill-opacity="0.92"/>
    <text x="180" y="190" font-size="20" font-weight="900" fill="#22a06b" text-anchor="middle"
          font-family="'Noto Sans TC', sans-serif">ESTJ</text>
    <rect x="225" y="150" width="60" height="60" rx="14" fill="#fff" fill-opacity="0.92"/>
    <text x="255" y="190" font-size="20" font-weight="900" fill="#22a06b" text-anchor="middle"
          font-family="'Noto Sans TC', sans-serif">ESFJ</text>
    <!-- Row 4 -->
    <rect x="0"   y="225" width="60" height="60" rx="14" fill="#fff" fill-opacity="0.92"/>
    <text x="30"  y="265" font-size="20" font-weight="900" fill="#d4a017" text-anchor="middle"
          font-family="'Noto Sans TC', sans-serif">ISTP</text>
    <rect x="75"  y="225" width="60" height="60" rx="14" fill="#fff" fill-opacity="0.92"/>
    <text x="105" y="265" font-size="20" font-weight="900" fill="#d4a017" text-anchor="middle"
          font-family="'Noto Sans TC', sans-serif">ISFP</text>
    <rect x="150" y="225" width="60" height="60" rx="14" fill="#fff" fill-opacity="0.92"/>
    <text x="180" y="265" font-size="20" font-weight="900" fill="#d4a017" text-anchor="middle"
          font-family="'Noto Sans TC', sans-serif">ESTP</text>
    <rect x="225" y="225" width="60" height="60" rx="14" fill="#fff" fill-opacity="0.92"/>
    <text x="255" y="265" font-size="20" font-weight="900" fill="#d4a017" text-anchor="middle"
          font-family="'Noto Sans TC', sans-serif">ESFP</text>
  </g>
</svg>
